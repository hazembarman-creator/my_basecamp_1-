<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyBaseCamp — Sign up</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="brand-row">
        <img src="img/logo.svg" alt="MyBaseCamp logo" class="logo" />
        <div>
          <div class="brand">MyBaseCamp</div>
          <div class="small">Create your free account</div>
        </div>
      </div>

      <nav class="header-actions">
        <a class="link" href="welcome.html">Home</a>
        <a class="link" href="login.html">Log in</a>
      </nav>
    </header>

    <main class="card" style="max-width:560px;margin:0 auto">
      <h2 style="margin-top:0">Create account</h2>
      <form id="signup-form" novalidate>
        <div style="margin-bottom:12px">
          <label for="name">Name</label><br/>
          <input id="name" name="name" type="text" required placeholder="Your name" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e5e7eb">
          <div class="small muted" id="hint-name">Your display name (won't be your login if you use email).</div>
        </div>

        <div style="margin-bottom:12px">
          <label for="email">Email</label><br/>
          <input id="email" name="email" type="email" required placeholder="you@example.com" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e5e7eb">
        </div>

        <div style="display:flex;gap:8px;margin-bottom:12px">
          <div style="flex:1">
            <label for="password">Password</label><br/>
            <input id="password" name="password" type="password" required placeholder="Min 6 characters" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e5e7eb">
          </div>
          <div style="flex:1">
            <label for="password2">Confirm password</label><br/>
            <input id="password2" name="password2" type="password" required placeholder="Repeat password" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e5e7eb">
          </div>
        </div>

        <div id="error" class="small" style="color:#b91c1c;margin-bottom:12px;display:none"></div>

        <div style="display:flex;gap:8px;align-items:center">
          <button type="submit" class="btn btn-primary">Sign up</button>
          <a href="login.html" class="small" style="margin-left:8px">Already have an account? Log in</a>
        </div>

        <div class="small muted" style="margin-top:12px">
          By signing up you agree that this demo stores data locally in your browser.
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <div>© <span id="year"></span> MyBaseCamp — frontend prototype</div>
    </footer>
  </div>

  <script src="js/app.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
